<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Депутатская школа</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, 'Segoe UI', 'Roboto', sans-serif; }
        body { background: linear-gradient(145deg, #eef2f5 0%, #d9e2e8 100%); min-height: 100vh; padding: 20px; }
        .app-container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 2rem; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.3); overflow: hidden; }
        .header { background: #0B2B40; color: white; padding: 1.2rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
        .logo h1 { font-size: 1.6rem; }
        .user-info { background: #1e4a62; padding: 8px 18px; border-radius: 60px; display: flex; align-items: center; gap: 15px; flex-wrap: wrap; position: relative; }
        .notifications-icon { position: relative; cursor: pointer; font-size: 1.5rem; }
        .notifications-count { position: absolute; top: -8px; right: -8px; background: #dc3545; color: white; border-radius: 50%; width: 18px; height: 18px; font-size: 0.7rem; display: flex; align-items: center; justify-content: center; }
        .notifications-dropdown { position: absolute; top: 50px; right: 0; width: 340px; background: white; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); z-index: 1000; max-height: 400px; overflow-y: auto; display: none; }
        .notifications-dropdown.show { display: block; }
        .notification-item { padding: 12px; border-bottom: 1px solid #e0e0e0; font-size: 0.85rem; color: #000; background: white; }
        .notification-item.task { background: #e8f4fd; border-left: 3px solid #0B2B40; }
        .notification-time { font-size: 0.7rem; color: #888; margin-top: 5px; }
        .logout-btn, .profile-edit-btn, .save-exit-btn { border: none; color: white; padding: 5px 14px; border-radius: 40px; cursor: pointer; font-weight: bold; }
        .logout-btn { background: #c73f1e; }
        .profile-edit-btn { background: #2c7da0; }
        .save-exit-btn { background: #28a745; }
        .nav-tabs { display: flex; background: #f4f7fa; border-bottom: 1px solid #cfdfe9; padding: 0 2rem; gap: 0.5rem; flex-wrap: wrap; }
        .nav-btn { background: none; border: none; padding: 1rem 1.5rem; font-size: 1rem; font-weight: 600; cursor: pointer; color: #2c5368; border-radius: 12px 12px 0 0; transition: 0.2s; }
        .nav-btn.active { background: white; color: #0B2B40; border-bottom: 3px solid #0B2B40; }
        .nav-btn:hover:not(.active) { background: #e6edf2; transform: translateY(-2px); }
        .content-pane { padding: 2rem; background: white; animation: fadeIn 0.3s ease; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: #fefefe; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 1.8rem; border: 1px solid #e2edf2; box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); }
        .card h3 { margin-bottom: 1rem; color: #0f3b4f; border-left: 5px solid #0B2B40; padding-left: 15px; }
        .warning-banner { background: #fff3cd; border-left: 4px solid #ffc107; padding: 15px; margin-bottom: 20px; border-radius: 12px; }
        .important-notification { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%); color: white; padding: 15px 20px; margin-bottom: 20px; border-radius: 12px; position: relative; animation: slideDown 0.4s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .important-notification .close-notif { position: absolute; top: 10px; right: 15px; background: none; border: none; color: white; font-size: 1.2rem; cursor: pointer; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; }
        .badge-active { background: #28a745; color: white; }
        .badge-pending { background: #ffc107; color: #000; }
        .badge-approved { background: #28a745; color: white; }
        .badge-blocked { background: #dc3545; color: white; }
        .badge-unlimited { background: #9b59b6; color: white; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 8px; border-bottom: 1px solid #dce5ea; }
        th { background: #eef3f8; font-weight: 600; }
        .btn-edit, .btn-delete, .btn-confirm, .btn-change-password, .btn-block, .btn-delete-card, .btn-debit, .btn-unblock { border: none; margin: 0 4px; padding: 5px 12px; border-radius: 30px; cursor: pointer; font-size: 0.75rem; font-weight: bold; transition: 0.2s; }
        .btn-edit { background: #2c7da0; color: white; }
        .btn-delete { background: #dc3545; color: white; }
        .btn-delete-card { background: #dc3545; color: white; }
        .btn-confirm { background: #28a745; color: white; }
        .btn-change-password { background: #ffc107; color: #000; }
        .btn-block { background: #fd7e14; color: white; }
        .btn-debit { background: #6f42c1; color: white; }
        .btn-unblock { background: #28a745; color: white; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 6px; font-weight: 500; }
        input, select, textarea { width: 100%; padding: 10px 15px; border: 1px solid #cbdde6; border-radius: 8px; font-size: 1rem; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #0B2B40; }
        button { background: #0B2B40; color: white; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1e5a6e; transform: scale(1.02); }
        .auth-box { max-width: 450px; margin: 2rem auto; padding: 2rem; }
        .auth-box button { background: #0B2B40; font-size: 1.1rem; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .error-msg { color: #dc3545; margin-top: 10px; }
        .transport-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 15px; border-radius: 12px; margin-top: 10px; }
        .transport-card.blocked { background: linear-gradient(135deg, #dc3545 0%, #a71d2a 100%); }
        .transport-card.unlimited { background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%); }
        .balance-info { display: flex; gap: 20px; margin-top: 10px; flex-wrap: wrap; }
        .balance-item { background: rgba(255,255,255,0.2); padding: 8px 12px; border-radius: 8px; }
        .meal-item { background: #f8f9fa; padding: 10px; margin: 10px 0; border-radius: 8px; }
        .calendar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-bottom: 20px; }
        .calendar-day { text-align: center; padding: 8px; border-radius: 8px; cursor: pointer; background: #f4f7fa; transition: 0.2s; }
        .calendar-day:hover { background: #e2edf2; transform: scale(1.02); }
        .calendar-day.selected { background: #0B2B40; color: white; }
        .calendar-day.today { border: 2px solid #0B2B40; }
        .calendar-day.has-meal { background: #d4edda; }
        .switch-auth a { color: #0B2B40; cursor: pointer; text-decoration: underline; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; padding: 2rem; border-radius: 1.5rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        @media (max-width: 768px) {
            .content-pane { padding: 1rem; }
            th, td { font-size: 0.8rem; }
            .card { padding: 1rem; }
            .calendar { gap: 4px; }
            .calendar-day { font-size: 0.7rem; padding: 4px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app-container" id="app"></div>

<script>
    // ========== SUPABASE НАСТРОЙКИ ==========
    const SUPABASE_URL = 'https://ochvlfmwzixakqvcfkmf.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_MR7dRmj_wTng2CIdIlmErA_fdrDlBW9';
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
    let currentUser = null;
    let activeTab = 'cabinet';
    let showNotifications = false;
    let showProfileModal = false;
    let selectedMealDate = new Date().toISOString().split('T')[0];
    let allUsers = [];
    let allCards = [];
    let allTasks = [];
    let allMeals = [];
    let allEvents = [];
    let allImportant = [];
    let allTopUpRequests = [];
    let allNotifications = [];

    // ========== ЗАГРУЗКА ДАННЫХ ==========
    async function loadAllData() {
        const { data: users } = await supabase.from('users').select('*');
        const { data: cards } = await supabase.from('transport_cards').select('*');
        const { data: tasks } = await supabase.from('tasks').select('*');
        const { data: meals } = await supabase.from('meals').select('*');
        const { data: events } = await supabase.from('events').select('*');
        const { data: important } = await supabase.from('important_notifications').select('*');
        const { data: requests } = await supabase.from('topup_requests').select('*');
        const { data: notifs } = await supabase.from('notifications').select('*');
        if(users) allUsers = users;
        if(cards) allCards = cards;
        if(tasks) allTasks = tasks;
        if(meals) allMeals = meals;
        if(events) allEvents = events;
        if(important) allImportant = important;
        if(requests) allTopUpRequests = requests;
        if(notifs) allNotifications = notifs;
    }

    // ========== СОХРАНЕНИЕ ДАННЫХ ==========
    async function saveUser(user) {
        if(user.id) await supabase.from('users').update(user).eq('id', user.id);
        else await supabase.from('users').insert(user);
        await loadAllData();
    }
    async function saveCard(card) {
        if(card.id) await supabase.from('transport_cards').update(card).eq('id', card.id);
        else await supabase.from('transport_cards').insert(card);
        await loadAllData();
    }
    async function deleteCard(cardId) { await supabase.from('transport_cards').delete().eq('id', cardId); await loadAllData(); }
    async function saveTask(task) {
        if(task.id) await supabase.from('tasks').update(task).eq('id', task.id);
        else await supabase.from('tasks').insert(task);
        await loadAllData();
    }
    async function deleteTask(taskId) { await supabase.from('tasks').delete().eq('id', taskId); await loadAllData(); }
    async function saveMeal(meal) {
        if(meal.id) await supabase.from('meals').update(meal).eq('id', meal.id);
        else await supabase.from('meals').insert(meal);
        await loadAllData();
    }
    async function deleteMeal(mealId) { await supabase.from('meals').delete().eq('id', mealId); await loadAllData(); }
    async function saveEvent(event) {
        if(event.id) await supabase.from('events').update(event).eq('id', event.id);
        else await supabase.from('events').insert(event);
        await loadAllData();
    }
    async function deleteEvent(eventId) { await supabase.from('events').delete().eq('id', eventId); await loadAllData(); }
    async function saveImportant(important) {
        if(important.id) await supabase.from('important_notifications').update(important).eq('id', important.id);
        else await supabase.from('important_notifications').insert(important);
        await loadAllData();
    }
    async function deleteImportant(importantId) { await supabase.from('important_notifications').delete().eq('id', importantId); await loadAllData(); }
    async function saveRequest(request) {
        if(request.id) await supabase.from('topup_requests').update(request).eq('id', request.id);
        else await supabase.from('topup_requests').insert(request);
        await loadAllData();
    }
    async function saveNotification(notif) { await supabase.from('notifications').insert(notif); await loadAllData(); }
    async function markNotificationRead(notifId) { await supabase.from('notifications').update({ read: true }).eq('id', notifId); await loadAllData(); }
    
    async function addNotification(userId, message, type = 'info') {
        await saveNotification({ id: Date.now(), user_id: userId, message: message, type: type, time: new Date().toLocaleString(), read: false });
    }
    async function getUnreadNotificationsCount(userId) {
        await loadAllData();
        return allNotifications.filter(n => n.user_id === userId && !n.read).length;
    }
    async function markAllNotificationsRead(userId) {
        const unread = allNotifications.filter(n => n.user_id === userId && !n.read);
        for(let n of unread) await markNotificationRead(n.id);
    }

    function getNextId(arr) { return arr.length > 0 ? Math.max(...arr.map(i => i.id)) + 1 : 1; }

    // ========== ПОЛЬЗОВАТЕЛИ ==========
    async function registerUser(login, password, fullname, group) {
        if(allUsers.find(u => u.login === login)) return false;
        const newUser = { id: getNextId(allUsers), login: login.trim(), password: password.trim(), fullname: fullname.trim() || 'Новый пользователь', role: 'user', status: 'pending', userStatus: 'active', group: group.trim() || 'Не назначена', birthDate: '', city: '', school: '' };
        await saveUser(newUser);
        await addNotification(newUser.id, '✅ Вы зарегистрировались. Ожидайте подтверждения.', 'success');
        return true;
    }
    async function updateUserProfile(userId, data) {
        const user = allUsers.find(u => u.id === userId);
        if(user) { Object.assign(user, data); await saveUser(user); if(currentUser?.id === userId) currentUser = user; return true; }
        return false;
    }
    async function updateUserAccountStatus(userId, newStatus) {
        const user = allUsers.find(u => u.id === userId);
        if(user && user.role !== 'admin') { user.userStatus = newStatus; await saveUser(user); await addNotification(userId, `📌 Ваш статус изменён на: ${getUserStatusText(newStatus)}`, 'warning'); return true; }
        return false;
    }
    function getUserStatusText(status) { const texts = { active: 'Активен', vacation: 'Отпуск', fired: 'Уволен', restricted: 'Временно ограничен' }; return texts[status] || status; }
    async function confirmUser(userId) {
        const user = allUsers.find(u => u.id === userId);
        if(user && user.role !== 'admin') { user.status = 'approved'; await saveUser(user); await addNotification(userId, '✅ Учётная запись подтверждена!', 'success'); return true; }
        return false;
    }
    async function deleteUserAccount(userId) {
        await supabase.from('users').delete().eq('id', userId);
        await supabase.from('transport_cards').delete().eq('user_id', userId);
        await supabase.from('tasks').delete().eq('assigned_to', userId);
        await supabase.from('notifications').delete().eq('user_id', userId);
        await loadAllData();
        if(currentUser?.id === userId) logout(true);
        return true;
    }
    async function changeUserPassword(userId, newPassword) {
        const user = allUsers.find(u => u.id === userId);
        if(user && newPassword?.trim()) { user.password = newPassword.trim(); await saveUser(user); await addNotification(userId, '🔑 Пароль изменён администратором', 'warning'); return true; }
        return false;
    }
    async function loginUser(login, password) {
        await loadAllData();
        const user = allUsers.find(u => u.login === login && u.password === password);
        if(!user) return { success: false, message: 'Неверный логин или пароль' };
        if(user.status === 'pending') { currentUser = user; return { success: true, warning: 'Учётная запись ожидает подтверждения' }; }
        if(user.userStatus === 'fired') return { success: false, message: 'Учётная запись уволена. Доступ запрещён' };
        if(user.userStatus === 'restricted') return { success: false, message: 'Доступ временно ограничен' };
        currentUser = user; activeTab = (user.role === 'admin') ? 'adminPanel' : 'cabinet';
        await addNotification(user.id, `🔐 Вход: ${new Date().toLocaleString()}`, 'info');
        return { success: true };
    }
    function logout(save = true) { currentUser = null; activeTab = 'cabinet'; renderApp(); }

    // ========== ВАЖНЫЕ УВЕДОМЛЕНИЯ ==========
    async function addImportantNotification(title, message) {
        await saveImportant({ id: Date.now(), title: title, message: message, created_at: new Date().toISOString() });
        for(let u of allUsers) if(u.role !== 'admin') await addNotification(u.id, `🔔 ВАЖНО: ${title}`, 'info');
        return true;
    }
    async function deleteImportantNotification(notifId) { await deleteImportant(notifId); return true; }

    // ========== ПИТАНИЕ ==========
    async function addMeal(date, mealType, dishes) {
        const existing = allMeals.find(m => m.date === date && m.meal_type === mealType);
        if(existing) { existing.dishes = dishes; await saveMeal(existing); }
        else await saveMeal({ id: getNextId(allMeals), date: date, meal_type: mealType, dishes: dishes });
        for(let u of allUsers) if(u.role !== 'admin') await addNotification(u.id, `🍽 Новое меню на ${date}: ${mealType === 'breakfast' ? 'Завтрак' : mealType === 'lunch' ? 'Обед' : 'Ужин'}`, 'info');
        return true;
    }
    async function deleteMealById(mealId) { await deleteMeal(mealId); return true; }
    function getMealsByDate(date) { return allMeals.filter(m => m.date === date); }
    function hasMealOnDate(date) { return allMeals.some(m => m.date === date); }

    // ========== ТРАНСПОРТНЫЕ КАРТЫ ==========
    function formatCardNumber(input) {
        let value = input.value.replace(/\D/g, '').slice(0, 9);
        let formatted = '';
        for (let i = 0; i < value.length; i++) { if (i > 0 && i % 3 === 0) formatted += ' '; formatted += value[i]; }
        input.value = formatted;
        return value;
    }
    function validateCardNumber(cardNumber) { return /^\d{9}$/.test(cardNumber.replace(/\s/g, '')); }
    async function requestTransportCard(userId, cardNumberWithSpaces) {
        if(!validateCardNumber(cardNumberWithSpaces)) return { success: false, message: 'Номер карты: 9 цифр (XXX XXX XXX)' };
        if(allCards.find(c => c.user_id === userId && c.status !== 'rejected')) return { success: false, message: 'У вас уже есть заявка или карта' };
        await saveCard({ id: getNextId(allCards), user_id: userId, card_number: cardNumberWithSpaces.replace(/\s/g, ''), card_number_formatted: cardNumberWithSpaces, status: 'pending', type: null, balance: 0, льготные_осталось: 0, льготные_совершено: 0, обычные_совершено: 0, обычные_доступно: 0, total_rides: 0, blocked: false, stop_list: false, unlimited: false, requested_at: new Date().toISOString() });
        await addNotification(userId, `🚌 Заявка на ТК №${cardNumberWithSpaces} отправлена`, 'info');
        for(let admin of allUsers.filter(u => u.role === 'admin')) await addNotification(admin.id, `📨 Новая заявка на ТК от ${allUsers.find(u => u.id === userId)?.fullname}`, 'info');
        return { success: true };
    }
    async function approveTransportCard(cardId, cardType) {
        const card = allCards.find(c => c.id === cardId);
        if(card) {
            card.status = 'approved'; card.type = cardType; card.unlimited = (cardType === 'social');
            if(cardType === 'schoolboy') { card.льготные_осталось = 45; card.льготные_совершено = 0; card.обычные_совершено = 0; card.обычные_доступно = 0; card.balance = 0; }
            else if(cardType === 'student') { card.льготные_осталось = 50; card.льготные_совершено = 0; card.обычные_совершено = 0; card.обычные_доступно = 0; card.balance = 0; }
            else if(cardType === 'general') { card.льготные_осталось = 0; card.льготные_совершено = 0; card.обычные_совершено = 0; card.обычные_доступно = 0; card.balance = 0; }
            else if(cardType === 'social') { card.balance = 'Безлимит'; card.льготные_осталось = '∞'; card.total_rides = 0; }
            card.approved_at = new Date().toISOString();
            await saveCard(card);
            await addNotification(card.user_id, `🚌 ТК подтверждена! Тип: ${getCardTypeText(cardType)}`, 'success');
            return true;
        }
        return false;
    }
    async function rejectTransportCard(cardId) {
        const card = allCards.find(c => c.id === cardId);
        if(card) { card.status = 'rejected'; await saveCard(card); await addNotification(card.user_id, '❌ Заявка на ТК отклонена', 'error'); return true; }
        return false;
    }
    async function deleteTransportCard(cardId, userId) { await deleteCard(cardId); await addNotification(userId, '🗑 Транспортная карта удалена', 'warning'); return true; }
    async function recalcRides(card) {
        if(card.unlimited || card.type === 'social') return;
        if(card.type === 'general') {
            card.обычные_доступно = Math.floor(card.balance / 37);
            card.обычные_совершено = card.обычные_совершено || 0;
            card.total_rides = card.обычные_совершено;
        } else if(card.type === 'schoolboy' || card.type === 'student') {
            if(card.льготные_осталось === 0 || card.льготные_осталось === '∞') card.обычные_доступно = Math.floor(card.balance / 37);
            else card.обычные_доступно = 0;
            card.total_rides = (card.льготные_совершено || 0) + (card.обычные_совершено || 0);
        }
        await saveCard(card);
    }
    async function updateCardBalance(cardId, newBalance) {
        const card = allCards.find(c => c.id === cardId);
        if(card && !card.unlimited) {
            card.balance = newBalance;
            if(card.blocked && card.stop_list && newBalance > 0) { card.blocked = false; card.stop_list = false; await addNotification(card.user_id, '✅ Карта разблокирована! Можете пользоваться.', 'success'); }
            await recalcRides(card);
            await addNotification(card.user_id, `💰 Баланс ТК: ${newBalance} руб.`, 'info');
            if(newBalance < 100 && !card.unlimited) await addNotification(card.user_id, `⚠️ Низкий баланс на ТК: ${newBalance} руб.`, 'low-balance');
            return true;
        }
        return false;
    }
    async function аннулироватьВсеЛьготныеПоездки(cardId) {
        const card = allCards.find(c => c.id === cardId);
        if(card && (card.type === 'schoolboy' || card.type === 'student')) {
            const макс = card.type === 'schoolboy' ? 45 : 50;
            card.льготные_осталось = 0; card.льготные_совершено = макс;
            await recalcRides(card);
            await addNotification(card.user_id, '❗ Ваши льготные поездки аннулированы администратором', 'warning');
            return true;
        }
        return false;
    }
    async function восстановитьВсеЛьготныеПоездки(cardId) {
        const card = allCards.find(c => c.id === cardId);
        if(card && (card.type === 'schoolboy' || card.type === 'student')) {
            const макс = card.type === 'schoolboy' ? 45 : 50;
            card.льготные_осталось = макс; card.льготные_совершено = 0;
            await recalcRides(card);
            await addNotification(card.user_id, '✅ Ваши льготные поездки восстановлены администратором', 'success');
            return true;
        }
        return false;
    }
    async function debitRide(cardId) {
        const card = allCards.find(c => c.id === cardId);
        if(!card) return { success: false, message: 'Карта не найдена' };
        if(card.unlimited) {
            card.total_rides = (card.total_rides || 0) + 1;
            await saveCard(card);
            await addNotification(card.user_id, '🎫 Поездка совершена (безлимит)', 'info');
            return { success: true, message: 'Поездка списана (безлимит)' };
        }
        if(card.blocked && card.stop_list) return { success: false, message: 'Карта в стоп-листе. Пополните баланс' };
        let success = false, message = '';
        if(card.type === 'general') {
            if(card.balance >= 37) {
                card.balance -= 37; card.обычные_совершено = (card.обычные_совершено || 0) + 1;
                card.обычные_доступно = Math.floor(card.balance / 37); card.total_rides = card.обычные_совершено;
                success = true; message = 'Списана 1 поездка (37 руб)';
            } else {
                card.balance -= 37; card.обычные_совершено = (card.обычные_совершено || 0) + 1;
                card.обычные_доступно = Math.floor(card.balance / 37); card.total_rides = card.обычные_совершено;
                success = true; message = 'Списана 1 поездка (баланс ушёл в минус)';
                card.blocked = true; card.stop_list = true;
                await addNotification(card.user_id, '🔴 Карта в стоп-листе! Пополните баланс.', 'error');
            }
        } else if(card.type === 'schoolboy' || card.type === 'student') {
            const льготЦена = card.type === 'schoolboy' ? 8.4 : 21;
            if(card.льготные_осталось > 0) {
                if(card.balance >= льготЦена) {
                    card.льготные_осталось--; card.льготные_совершено++;
                    card.balance -= льготЦена; card.total_rides = card.льготные_совершено + (card.обычные_совершено || 0);
                    success = true; message = `Списана 1 льготная поездка (${льготЦена} руб). Осталось льготных: ${card.льготные_осталось}`;
                } else {
                    success = false; message = `Недостаточно средств. Нужно ${льготЦена} руб, доступно ${card.balance} руб`;
                    card.blocked = true; card.stop_list = true;
                    await addNotification(card.user_id, '🔴 Карта в стоп-листе! Пополните баланс.', 'error');
                }
            } else {
                if(card.balance >= 37) {
                    card.balance -= 37; card.обычные_совершено = (card.обычные_совершено || 0) + 1;
                    card.обычные_доступно = Math.floor(card.balance / 37);
                    card.total_rides = card.льготные_совершено + card.обычные_совершено;
                    success = true; message = 'Списана 1 обычная поездка (37 руб)';
                } else {
                    success = false; message = `Недостаточно средств. Нужно 37 руб, доступно ${card.balance} руб`;
                    card.blocked = true; card.stop_list = true;
                    await addNotification(card.user_id, '🔴 Карта в стоп-листе! Пополните баланс.', 'error');
                }
            }
        }
        if(success) { await recalcRides(card); await addNotification(card.user_id, `🎫 ${message}`, 'info'); }
        await saveCard(card);
        return { success, message };
    }
    async function blockTransportCard(cardId) {
        const card = allCards.find(c => c.id === cardId);
        if(card) { card.blocked = true; await saveCard(card); await addNotification(card.user_id, '🔒 ТК заблокирована', 'warning'); return true; }
        return false;
    }
